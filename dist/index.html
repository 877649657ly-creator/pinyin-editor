<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>pinyin-editor</title>
    <script type="module" crossorigin src="./assets/index-CA2NUKlp.js"></script>
    <link id="theme-css" rel="stylesheet" crossorigin href="./assets/index-IuLkZs1A.css">
    <style>
      #theme-switcher {
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 9999;
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        background: rgba(255,255,255,.9);
        backdrop-filter: blur(8px);
        padding: 6px 12px;
        border-radius: 8px;
        box-shadow: 0 2px 12px rgba(0,0,0,.1);
        border: 1px solid rgba(0,0,0,.08);
        font-family: -apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;
      }
      #theme-switcher label {
        color: #666;
        white-space: nowrap;
      }
      #theme-switcher select {
        padding: 4px 8px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        font-size: 13px;
        outline: none;
        cursor: pointer;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="theme-switcher">
      <label for="theme-select">主题</label>
      <select id="theme-select">
        <option value="index-IuLkZs1A">清新蓝白</option>
        <option value="index-yellow">温暖米黄</option>
        <option value="index-green">薄荷护眼</option>
        <option value="index-dark">深空专业</option>
      </select>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        var link = document.getElementById('theme-css');
        var select = document.getElementById('theme-select');
        var saved = localStorage.getItem('pinyin-theme');
        if (saved) {
          link.href = './assets/' + saved + '.css';
          select.value = saved;
        }
        select.addEventListener('change', function() {
          var val = select.value;
          link.href = './assets/' + val + '.css';
          localStorage.setItem('pinyin-theme', val);
        });
      })();
    </script>
  </body>
</html>
