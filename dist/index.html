<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <title>pinyin-editor</title>
    <script type="module" crossorigin src="./assets/index-CA2NUKlp.js"></script>
    <link id="theme-css" rel="stylesheet" crossorigin href="./assets/index-IuLkZs1A.css">
    <style>
      #theme-switcher {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid #d9d9d9;
        background: #fff;
        font-family: -apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;
        margin-left: 8px;
      }
      #theme-switcher label {
        color: #666;
        white-space: nowrap;
      }
      #theme-switcher select {
        padding: 3px 6px;
        border: 1px solid #d9d9d9;
        border-radius: 4px;
        font-size: 13px;
        outline: none;
        cursor: pointer;
        background: #fff;
      }
    </style>
  </head>
  <body>
    <div id="theme-switcher" style="display:none">
      <label for="theme-select">主题</label>
      <select id="theme-select">
        <option value="index-IuLkZs1A">清新蓝白</option>
        <option value="index-yellow">温暖米黄</option>
        <option value="index-green">薄荷护眼</option>
        <option value="index-dark">深空专业</option>
      </select>
    </div>
    <div id="root"></div>
    <script>
      (function() {
        function init() {
          var toolbarActions = document.querySelector('.toolbar-actions');
          if (!toolbarActions) return false;

          // Remove import/export JSON buttons
          var buttons = toolbarActions.querySelectorAll('button');
          buttons.forEach(function(btn) {
            var text = btn.textContent || '';
            if (text.indexOf('导入JSON') !== -1 || text.indexOf('导出JSON') !== -1) {
              btn.remove();
            }
          });

          // Move theme switcher into toolbar-actions
          var switcher = document.getElementById('theme-switcher');
          if (switcher && switcher.parentNode !== toolbarActions) {
            switcher.style.display = '';
            toolbarActions.appendChild(switcher);
          }

          return true;
        }

        // Try immediately and poll for React render
        if (!init()) {
          var observer = new MutationObserver(function() {
            if (init()) {
              observer.disconnect();
            }
          });
          observer.observe(document.body, { childList: true, subtree: true });
          // Fallback: stop observing after 5s
          setTimeout(function() { observer.disconnect(); }, 5000);
        }

        // Theme switching logic
        var link = document.getElementById('theme-css');
        var select = document.getElementById('theme-select');
        var saved = localStorage.getItem('pinyin-theme');
        if (saved) {
          link.href = './assets/' + saved + '.css';
          select.value = saved;
        }
        select.addEventListener('change', function() {
          var val = select.value;
          link.href = './assets/' + val + '.css';
          localStorage.setItem('pinyin-theme', val);
        });
      })();
    </script>
  </body>
</html>
